name: nettrace
description: NetTrace - iOS 轻量本地 HTTP/HTTPS 抓包调试工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 加密 & 证书
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  # 工具
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  # HTTP 解析
  http_parser: ^4.0.2
  # 权限
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/certs/
